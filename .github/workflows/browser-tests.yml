# Cross-browser tests: the same Playwright suite (tests/) in Chromium, Firefox
# and WebKit (Safari's engine), desktop and phone. See tests/README.md.
name: Browser tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false          # one engine failing must not hide another's result
      matrix:
        include:
          - { project: chromium,      browser: chromium }
          - { project: firefox,       browser: firefox }
          - { project: webkit,        browser: webkit }
          - { project: mobile-safari, browser: webkit }
          - { project: mobile-chrome, browser: chromium }
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.project }}
          path: |
            tests/playwright-report/
            tests/test-results/
          retention-days: 14
