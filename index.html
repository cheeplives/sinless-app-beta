<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101214">
<title>Sinless — Character Dossier</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="static/fonts.css">
<link rel="stylesheet" href="static/style.css">
<script src="static/theme-init.js"></script>
</head>
<body>
<nav id="workspace-tabs" aria-label="Open characters"></nav>
<!-- App-level controls at the right end of the top bar: Account (hidden in local-only mode; a KIT.menu filled by
     initAccountMenu() in static/auth-ui.js) and Settings, which holds the colour scheme, light/dark mode and the
     open character's house rules. Character actions live in the menu at the left end of the bar. -->
<div id="theme-controls" class="theme-controls">
  <div id="account-menu" hidden></div>
  <div id="settings-menu" class="scheme-menu">
    <button id="settings-btn" class="theme-toggle" type="button" aria-haspopup="true" aria-expanded="false" data-tip="Settings" aria-label="Settings"></button>
    <div id="settings-pop" class="settings-panel" aria-label="Settings" hidden>
      <h4>Appearance</h4>
      <ul id="scheme-list" class="scheme-list" role="menu" aria-label="Colour scheme"></ul>
      <button id="theme-toggle" class="mode-row" type="button"></button>
      <div id="settings-panel"></div>
      <p class="settings-credit">Icons from game-icons.net by Lorc, Delapouite and sbed, CC BY 3.0.</p>
    </div>
  </div>
</div>
<div id="app">
  <aside id="rail">
    <header class="rail-brand">
      <div class="brand-mark">SINLESS</div>
      <div class="brand-sub">character dossier</div>
    </header>

    <div class="rail-block">
      <input id="char-name" class="name-input" placeholder="Street name" spellcheck="false">
      <input id="char-player" class="player-input" placeholder="Player" spellcheck="false">
    </div>

    <!-- What still has to be fixed before this character is legal. In the rail's own flow so it never covers
         anything; on a narrow screen it becomes a one-line bar along the bottom that opens on a tap. -->
    <div id="rail-alerts"></div>

    <div class="rail-block">
      <div class="rail-label">Pools</div>
      <div id="rail-pools" class="pool-grid"></div>
    </div>

    <div class="rail-block">
      <div class="rail-label">Condition</div>
      <div id="rail-condition"></div>
    </div>

    <div class="rail-block">
      <div class="rail-label">Budgets</div>
      <div id="rail-budgets"></div>
    </div>

    <div class="rail-block">
      <div class="rail-label">Zoetics</div>
      <div id="rail-zoetics"></div>
    </div>

  </aside>

  <main id="main">
    <nav id="tabs"></nav>
    <section id="panel"></section>
  </main>
</div>
<div id="sheet" hidden></div>
<div id="homebrew" hidden></div>
<div id="login" hidden></div>
<div id="pending" hidden></div>
<div id="admin" hidden></div>
<div id="shared" hidden></div>
<script src="static/icons.js"></script>
<script src="static/kit.js"></script>
<script src="static/data.js"></script>
<script src="static/rules.js"></script>
<script src="static/storage.js"></script>
<script src="static/sync.js"></script>
<script src="static/homebrew.js"></script>
<script src="static/app.js"></script>
<script src="static/sheet.js"></script>
<script src="static/md-import.js"></script>
<script src="static/workspace.js"></script>
<script src="static/auth-ui.js"></script>
<script src="static/register-sw.js"></script>
</body>
</html>
